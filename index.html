html{scroll-behavior:smooth;max-width:100vw;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#FFF9FA;color:#3D2A2E;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.serif{font-family:Georgia,'Times New Roman',serif}
img{image-rendering:auto;background:#fff;display:block;max-width:100%}
* img{image-rendering:auto;background:#fff}
.serif{font-family:Georgia,'Times New Roman',serif}
a{color:inherit;text-decoration:none}
a:hover{color:#B76E79}
.skip{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip:focus{left:12px;top:12px;width:auto;height:auto;background:#3D2A2E;color:#fff;padding:8px 12px;border-radius:999px;z-index:99}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px;width:100%}
.sale{background:#3D2A2E;color:#FFF9FA;text-align:center;padding:9px 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.sale code{background:#ffffff1a;border:1px solid #ffffff2a;border-radius:999px;padding:2px 8px;margin-left:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #F3D1D5;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.08em;font-size:18px}
.nav{display:flex;gap:18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;flex-wrap:wrap}
.btn{border:1px solid #F3D1D5;background:#fff;border-radius:999px;padding:8px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-dark{background:#3D2A2E;color:#fff;border-color:#3D2A2E}
.btn-rose{background:#B76E79;color:#fff;border-color:#B76E79}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;padding:22px 0 14px}
.hero h1{font-size:clamp(32px,6vw,54px);line-height:.95;letter-spacing:-.02em}
.hero p{margin-top:12px;color:#6b5458;max-width:42ch;font-size:14px}
.hero img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid #F3D1D5;background:#fff;display:block;image-rendering:auto}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{border:1px solid #F3D1D5;border-radius:16px;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 20px #b76e7921;overflow:hidden}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff;display:block;image-rendering:auto}
.pad{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.price{font-size:12px;color:#B76E79;font-weight:700}
.banners{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.banner{border:1px solid #F3D1D5;border-radius:12px;background:#fff;padding:8px;text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;overflow:hidden}
.banner img{width:100%;height:auto;background:#fff;image-rendering:auto;border-radius:8px;display:block}
footer{margin-top:22px;border-top:1px solid #F3D1D5;background:#3D2A2E;color:#FFF9FA;padding:22px 0}
footer a{color:#F9E7E9;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#ffffff30}
.foot{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:18px}
